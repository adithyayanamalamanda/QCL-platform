    const { useState, useEffect, useRef } = React;

    // --- QUANTUM SIMULATION ENGINE ---
    const COMPLEX = {
      create: (r = 0, i = 0) => ({ r, i }),
      add: (a, b) => ({ r: a.r + b.r, i: a.i + b.i }),
      sub: (a, b) => ({ r: a.r - b.r, i: a.i - b.i }),
      mul: (a, b) => ({ r: a.r * b.r - a.i * b.i, i: a.r * b.i + a.i * b.r }),
      mulScalar: (a, s) => ({ r: a.r * s, i: a.i * s }),
      magSq: (a) => a.r * a.r + a.i * a.i
    };

    const SQRT1_2 = Math.SQRT1_2;

    const GATES = {
      X: [
        [COMPLEX.create(0, 0), COMPLEX.create(1, 0)],
        [COMPLEX.create(1, 0), COMPLEX.create(0, 0)]
      ],
      Y: [
        [COMPLEX.create(0, 0), COMPLEX.create(0, -1)],
        [COMPLEX.create(0, 1), COMPLEX.create(0, 0)]
      ],
      Z: [
        [COMPLEX.create(1, 0), COMPLEX.create(0, 0)],
        [COMPLEX.create(0, 0), COMPLEX.create(-1, 0)]
      ],
      H: [
        [COMPLEX.create(SQRT1_2, 0), COMPLEX.create(SQRT1_2, 0)],
        [COMPLEX.create(SQRT1_2, 0), COMPLEX.create(-SQRT1_2, 0)]
      ]
    };

    function applyGate(gateMatrix, state = [COMPLEX.create(1, 0), COMPLEX.create(0, 0)]) {
      const [alpha, beta] = state;
      const newAlpha = COMPLEX.add(
        COMPLEX.mul(gateMatrix[0][0], alpha),
        COMPLEX.mul(gateMatrix[0][1], beta)
      );
      const newBeta = COMPLEX.add(
        COMPLEX.mul(gateMatrix[1][0], alpha),
        COMPLEX.mul(gateMatrix[1][1], beta)
      );
      return [newAlpha, newBeta];
    }

    function getBlochCoordinates(state) {
      const [alpha, beta] = state;
      const conjBeta = COMPLEX.create(beta.r, -beta.i);
      const alphaConjBeta = COMPLEX.mul(alpha, conjBeta);
      const x = 2 * alphaConjBeta.r;
      const y = 2 * (alpha.r * beta.i - alpha.i * beta.r);
      const z = COMPLEX.magSq(alpha) - COMPLEX.magSq(beta);
      return { x, y, z };
    }

    function getProbabilities(state) {
      const p0 = COMPLEX.magSq(state[0]);
      const p1 = COMPLEX.magSq(state[1]);
      const total = p0 + p1 || 1;
      return {
        p0: Math.round((p0 / total) * 1000) / 10,
        p1: Math.round((p1 / total) * 1000) / 10,
        raw0: p0 / total
      };
    }

    function simulateTwoQubit(gates = []) {
      let state = [COMPLEX.create(1, 0), COMPLEX.create(0, 0), COMPLEX.create(0, 0), COMPLEX.create(0, 0)];
      for (const g of gates) {
        if (g.type === 'H' && g.target === 0) {
          const ns = [COMPLEX.create(0, 0), COMPLEX.create(0, 0), COMPLEX.create(0, 0), COMPLEX.create(0, 0)];
          ns[0] = COMPLEX.mulScalar(COMPLEX.add(state[0], state[2]), SQRT1_2);
          ns[1] = COMPLEX.mulScalar(COMPLEX.add(state[1], state[3]), SQRT1_2);
          ns[2] = COMPLEX.mulScalar(COMPLEX.sub(state[0], state[2]), SQRT1_2);
          ns[3] = COMPLEX.mulScalar(COMPLEX.sub(state[1], state[3]), SQRT1_2);
          state = ns;
        } else if (g.type === 'H' && g.target === 1) {
          const ns = [COMPLEX.create(0, 0), COMPLEX.create(0, 0), COMPLEX.create(0, 0), COMPLEX.create(0, 0)];
          ns[0] = COMPLEX.mulScalar(COMPLEX.add(state[0], state[1]), SQRT1_2);
          ns[1] = COMPLEX.mulScalar(COMPLEX.sub(state[0], state[1]), SQRT1_2);
          ns[2] = COMPLEX.mulScalar(COMPLEX.add(state[2], state[3]), SQRT1_2);
          ns[3] = COMPLEX.mulScalar(COMPLEX.sub(state[2], state[3]), SQRT1_2);
          state = ns;
        } else if (g.type === 'CNOT') {
          state = [state[0], state[1], state[3], state[2]];
        } else if (g.type === 'ORACLE_11') {
          state[3] = COMPLEX.mulScalar(state[3], -1);
        } else if (g.type === 'DIFFUSION') {
          const avg = COMPLEX.mulScalar(
            COMPLEX.add(COMPLEX.add(state[0], state[1]), COMPLEX.add(state[2], state[3])),
            0.25
          );
          state = state.map(amp => COMPLEX.sub(COMPLEX.mulScalar(avg, 2), amp));
        }
      }
      const probs = state.map(amp => COMPLEX.magSq(amp));
      const sum = probs.reduce((a, b) => a + b, 0) || 1;
      return {
        '00': Math.round((probs[0] / sum) * 1000) / 10,
        '01': Math.round((probs[1] / sum) * 1000) / 10,
        '10': Math.round((probs[2] / sum) * 1000) / 10,
        '11': Math.round((probs[3] / sum) * 1000) / 10
      };
    }

    // --- BLOCH SPHERE CANVAS COMPONENT ---
    function BlochSphere({ state = [COMPLEX.create(1, 0), COMPLEX.create(0, 0)] }) {
      const canvasRef = useRef(null);
      const { x, y, z } = getBlochCoordinates(state);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const r = 85;

        ctx.clearRect(0, 0, w, h);

        // Gradient sphere
        const grad = ctx.createRadialGradient(cx, cy, 20, cx, cy, r);
        grad.addColorStop(0, 'rgba(139, 92, 246, 0.2)');
        grad.addColorStop(1, 'rgba(15, 23, 42, 0.6)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();

        // Wireframe circle
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Equatorial Ring
        ctx.strokeStyle = 'rgba(99, 102, 241, 0.35)';
        ctx.beginPath();
        ctx.ellipse(cx, cy, r, r * 0.35, 0, 0, Math.PI * 2);
        ctx.stroke();

        // Z-axis line
        ctx.strokeStyle = '#a78bfa';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(cx, cy - r - 10);
        ctx.lineTo(cx, cy + r + 10);
        ctx.stroke();

        // Axis labels
        ctx.fillStyle = '#a78bfa';
        ctx.font = 'bold 10px monospace';
        ctx.fillText('|0⟩', cx + 6, cy - r + 5);
        ctx.fillStyle = '#f472b6';
        ctx.fillText('|1⟩', cx + 6, cy + r + 5);

        // Vector arrow
        const px = cx + (x * 0.7 - y * 0.4) * r;
        const py = cy - z * r + (x * 0.2 + y * 0.1) * r * 0.3;

        ctx.strokeStyle = '#06b6d4';
        ctx.lineWidth = 3.5;
        ctx.shadowColor = '#06b6d4';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(px, py);
        ctx.stroke();
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(px, py, 4.5, 0, Math.PI * 2);
        ctx.fill();
      }, [x, y, z]);

      return (
        <div className="flex flex-col items-center bg-slate-900/60 p-3 rounded-2xl border border-slate-800">
          <canvas ref={canvasRef} width="220" height="220" className="rounded-xl" />
          <div className="flex gap-2 text-[11px] font-mono text-slate-300 mt-1">
            <span>x: {x.toFixed(2)}</span>
            <span>y: {y.toFixed(2)}</span>
            <span>z: {z.toFixed(2)}</span>
          </div>
        </div>
      );
    }

    // --- PROBABILITY BARS ---
    function ProbabilityBars({ probabilities = { p0: 100, p1: 0 }, isTwoQubit = false }) {

                    <div className="h-full bg-gradient-to-r from-purple-500 to-cyan-400 transition-all duration-300" style={{ width: `${Math.max(2, val)}%` }} />
                  </div>
                </div>
              );
            })}
          </div>
        );
      }

      return (
        <div className="w-full bg-slate-900/90 rounded-2xl p-4 border border-slate-800 space-y-3">
          <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">
            Measurement Probabilities
          </div>
          <div>
            <div className="flex justify-between text-xs font-mono mb-1">
              <span className="text-purple-300 font-bold">|0⟩ Ground State</span>
              <span className="text-white font-bold">{probabilities.p0.toFixed(1)}%</span>
            </div>
            <div className="w-full h-3.5 bg-slate-950 rounded-full overflow-hidden">
              <div className="h-full bg-gradient-to-r from-purple-600 to-indigo-500 transition-all duration-300" style={{ width: `${Math.max(2, probabilities.p0)}%` }} />
            </div>
          </div>
          <div>
            <div className="flex justify-between text-xs font-mono mb-1">
              <span className="text-cyan-300 font-bold">|1⟩ Excited State</span>
              <span className="text-white font-bold">{probabilities.p1.toFixed(1)}%</span>
            </div>
            <div className="w-full h-3.5 bg-slate-950 rounded-full overflow-hidden">
              <div className="h-full bg-gradient-to-r from-cyan-600 to-teal-400 transition-all duration-300" style={{ width: `${Math.max(2, probabilities.p1)}%` }} />
            </div>
          </div>
        </div>
      );
    }

    // --- MAIN DUOLINGO APP COMPONENT ---
    function App() {
      const [view, setView] = useState('path'); // 'path' | 'lesson'

      const [lessonStep, setLessonStep] = useState('overview'); // 'overview' | 'simulator' | 'quiz' | 'results'
      const [mistakes, setMistakes] = useState(0);
      const [feedback, setFeedback] = useState(null);

      // Persisted Gamification state
      const [stats, setStats] = useState(() => {
        const saved = localStorage.getItem('qq_standalone_stats');
        return saved ? JSON.parse(saved) : { xp: 0, streak: 4, hearts: 5, completed: [], levelStars: {} };
      });

      const saveStats = (newStats) => {
        setStats(newStats);
        localStorage.setItem('qq_standalone_stats', JSON.stringify(newStats));
      };

      const activeLevel = LEVELS.find(l => l.id === activeLevelId) || LEVELS[0];

      // Simulator local state
      const [qubitState, setQubitState] = useState([COMPLEX.create(1, 0), COMPLEX.create(0, 0)]);
      const [twoQubitProbs, setTwoQubitProbs] = useState({ '00': 100, '01': 0, '10': 0, '11': 0 });
      const [twoQubitGates, setTwoQubitGates] = useState([]);
      const [shots, setShots] = useState({ c0: 0, c1: 0, total: 0 });

      const singleProbs = getProbabilities(qubitState);

      const openLevel = (lvlId) => {
        setActiveLevelId(lvlId);
        setLessonStep('overview');
        setMistakes(0);
        setFeedback(null);
        setQubitState([COMPLEX.create(1, 0), COMPLEX.create(0, 0)]);
        setTwoQubitGates([]);
        setTwoQubitProbs({ '00': 100, '01': 0, '10': 0, '11': 0 });
        setShots({ c0: 0, c1: 0, total: 0 });
        setView('lesson');
      };

      const handleQuiz = (idx) => {
        if (idx === activeLevel.quiz.correctIndex) {
          saveStats({ ...stats, xp: stats.xp + 10 });
          setFeedback({ isCorrect: true, text: activeLevel.quiz.explanation });
        } else {
          const newHearts = Math.max(0, stats.hearts - 1);
          setMistakes(m => m + 1);
          saveStats({ ...stats, hearts: newHearts });
          setFeedback({ isCorrect: false, text: activeLevel.quiz.explanation });
        }
      };

      const handleContinueFromFeedback = () => {
        if (feedback?.isCorrect) {
          const stars = mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1;
          const completedSet = new Set(stats.completed);
          completedSet.add(activeLevel.id);
          const starsMap = { ...stats.levelStars, [activeLevel.id]: Math.max(stats.levelStars[activeLevel.id] || 0, stars) };
          saveStats({
            ...stats,
            xp: stats.xp + 25,
            completed: Array.from(completedSet),
            levelStars: starsMap
          });
          setFeedback(null);
          setLessonStep('results');
        } else {
          setFeedback(null);
        }
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          {/* TOP BAR */}
          <header className="sticky top-0 z-40 bg-slate-950/90 backdrop-blur-md border-b border-slate-800 px-4 py-3">
            <div className="max-w-4xl mx-auto flex items-center justify-between">
              <div onClick={() => setView('path')} className="flex items-center gap-2 cursor-pointer select-none">
                <span className="text-2xl">⚛️</span>
                <span className="font-extrabold text-lg text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-indigo-300 to-cyan-400">
                  QuantumQuest
                </span>
              </div>

              <div className="flex items-center gap-3 text-sm font-bold">
                <div onClick={() => saveStats({ ...stats, streak: stats.streak + 1 })} title="Click to boost streak" className="flex items-center gap-1 bg-slate-900 border border-amber-500/30 text-amber-400 px-3 py-1 rounded-xl cursor-pointer">
                  🔥 {stats.streak}
                </div>
                <div className="flex items-center gap-1 bg-slate-900 border border-purple-500/30 text-purple-300 px-3 py-1 rounded-xl">
                  ⚡ {stats.xp} XP
                </div>
                <div onClick={() => saveStats({ ...stats, hearts: 5 })} title="Click to refill hearts" className="flex items-center gap-1 bg-slate-900 border border-rose-500/30 text-rose-400 px-3 py-1 rounded-xl cursor-pointer">
                  ❤️ {stats.hearts}
                </div>
              </div>
            </div>
          </header>

          {/* PATH VIEW */}
          {view === 'path' && (
            <main className="max-w-md w-full mx-auto px-4 py-8 flex flex-col items-center">
              <div className="w-full bg-slate-900/80 rounded-3xl p-5 border border-purple-500/30 shadow-xl mb-10 text-center">
                <span className="text-[10px] font-bold tracking-widest text-cyan-400 uppercase">Quantum Curriculum</span>
                <h2 className="text-xl font-extrabold text-white mt-0.5">Quantum Computing Skill Tree</h2>
                <p className="text-xs text-slate-400 mt-1">Master qubits, gates, entanglement & Grover's search</p>
              </div>

              {/* Dotted path nodes */}
              <div className="relative flex flex-col items-center space-y-12 pb-16 w-full">
                {LEVELS.map((lvl, i) => {
                  const isDone = stats.completed.includes(lvl.id);
                  const isUnlocked = isDone || lvl.id === 1 || stats.completed.includes(lvl.id - 1);
                  const stars = stats.levelStars[lvl.id] || 0;
                  const offsets = [0, 60, -60, 60, -60, 0];
                  const offX = offsets[i % offsets.length];

                  return (
                    <div key={lvl.id} className="flex flex-col items-center" style={{ transform: `translateX(${offX}px)` }}>
                      <button
                        onClick={() => isUnlocked && openLevel(lvl.id)}
                        disabled={!isUnlocked}
                        className={`w-20 h-20 rounded-full flex flex-col items-center justify-center border-4 shadow-xl text-xl font-bold transition-transform active:scale-95 ${
                          isDone
                            ? 'bg-gradient-to-tr from-emerald-600 to-teal-400 border-emerald-300 shadow-emerald-500/30 hover:scale-105'
                            : isUnlocked
                            ? 'bg-gradient-to-tr from-purple-600 to-cyan-400 border-purple-300 shadow-purple-500/50 animate-pulse-glow hover:scale-110'
                            : 'bg-slate-800 border-slate-700 text-slate-500 cursor-not-allowed opacity-60'
                        }`}
                      >
                        {isDone ? '✓' : isUnlocked ? lvl.icon : '🔒'}
                        {isDone && (
                          <div className="flex text-[10px] text-amber-300 mt-0.5">
                            {'★'.repeat(stars)}{'☆'.repeat(3 - stars)}
                          </div>
                        )}
                      </button>

                      <div className="text-center mt-2 max-w-[130px]">
                        <span className="text-[10px] font-extrabold text-slate-400 block">Level {lvl.id}</span>
                        <span className="text-xs font-bold text-slate-200 leading-tight">{lvl.title}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </main>
          )}

          {/* LESSON VIEW */}
          {view === 'lesson' && (
            <main className="max-w-2xl w-full mx-auto px-4 py-6 flex-1 flex flex-col justify-center">
              {/* LESSON STEP 1: OVERVIEW */}
              {lessonStep === 'overview' && (
                <div className="bg-slate-900 rounded-3xl p-6 sm:p-8 border border-slate-800 shadow-2xl space-y-5 animate-fadeIn">
                  <div className="flex justify-between items-center text-xs text-purple-400 font-bold uppercase">
                    <span>{activeLevel.overview.tag}</span>
                    <span>Level {activeLevel.id}</span>
                  </div>
                  <h2 className="text-2xl font-extrabold text-white">{activeLevel.overview.heading}</h2>
                  <p className="text-base text-slate-300 leading-relaxed">{activeLevel.overview.description}</p>
                  <div className="p-4 rounded-2xl bg-slate-950 border border-slate-800 text-xs text-cyan-300">
                    💡 <strong>Takeaway:</strong> {activeLevel.overview.takeaway}
                  </div>
                  <button
                    onClick={() => setLessonStep('simulator')}
                    className="w-full py-4 rounded-2xl font-bold bg-gradient-to-r from-purple-600 to-cyan-500 text-white shadow-lg shadow-purple-600/30 text-lg"
                  >
                    Continue to Simulator ➔
                  </button>
                </div>
              )}

              {/* LESSON STEP 2: SIMULATOR */}
              {lessonStep === 'simulator' && (
                <div className="space-y-4 animate-fadeIn">
                  <div className="bg-slate-900 p-5 rounded-3xl border border-slate-800 flex justify-between items-center">
                    <div>
                      <h3 className="font-bold text-lg text-white">{activeLevel.simulator.title}</h3>
                      <p className="text-xs text-slate-300">{activeLevel.simulator.instructions}</p>
                    </div>
                    <button
                      onClick={() => setLessonStep('quiz')}
                      className="px-5 py-2.5 rounded-xl font-bold bg-gradient-to-r from-cyan-500 to-purple-600 text-white text-sm shadow-md flex-shrink-0 ml-3"
                    >
                      Ready for Quiz ✓
                    </button>
                  </div>

                  {/* Simulator Area */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 items-center">
                    {activeLevel.id === 4 || activeLevel.id === 6 ? (
                      <ProbabilityBars probabilities={twoQubitProbs} isTwoQubit={true} />
                    ) : (
                      <>
                        <BlochSphere state={qubitState} />
                        <ProbabilityBars probabilities={singleProbs} />
                      </>
                    )}
                  </div>

                  {/* Gate Controls */}
                  <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex flex-wrap gap-2 justify-center">
                    {activeLevel.id < 4 && (
                      <>
                        <button onClick={() => setQubitState(applyGate(GATES.X, qubitState))} className="px-4 py-2 bg-cyan-900 border border-cyan-600 rounded-xl text-cyan-300 font-bold">X Gate</button>
                        <button onClick={() => setQubitState(applyGate(GATES.H, qubitState))} className="px-4 py-2 bg-purple-900 border border-purple-600 rounded-xl text-purple-300 font-bold">H Gate</button>
                        <button onClick={() => setQubitState(applyGate(GATES.Z, qubitState))} className="px-4 py-2 bg-blue-900 border border-blue-600 rounded-xl text-blue-300 font-bold">Z Gate</button>
                        <button onClick={() => setQubitState([COMPLEX.create(1, 0), COMPLEX.create(0, 0)])} className="px-4 py-2 bg-slate-800 rounded-xl text-slate-300 text-xs">Reset |0⟩</button>
                      </>
                    )}
                    {activeLevel.id === 4 && (
                      <>
                        <button onClick={() => { const g = [...twoQubitGates, { type: 'H', target: 0 }]; setTwoQubitGates(g); setTwoQubitProbs(simulateTwoQubit(g)); }} className="px-3 py-2 bg-purple-900 border border-purple-600 rounded-xl text-purple-300 font-bold text-xs">1. H on Q0</button>
                        <button onClick={() => { const g = [...twoQubitGates, { type: 'CNOT' }]; setTwoQubitGates(g); setTwoQubitProbs(simulateTwoQubit(g)); }} className="px-3 py-2 bg-cyan-900 border border-cyan-600 rounded-xl text-cyan-300 font-bold text-xs">2. CNOT (Q0➔Q1)</button>
                        <button onClick={() => { setTwoQubitGates([]); setTwoQubitProbs(simulateTwoQubit([])); }} className="px-3 py-2 bg-slate-800 rounded-xl text-slate-300 text-xs">Reset</button>
                      </>
                    )}
                    {activeLevel.id === 5 && (
                      <>
                        <button onClick={() => {
                          const outcome = Math.random() < singleProbs.raw0 ? '0' : '1';
                          setShots(s => ({ c0: outcome === '0' ? s.c0 + 1 : s.c0, c1: outcome === '1' ? s.c1 + 1 : s.c1, total: s.total + 1 }));
                          setQubitState(outcome === '0' ? [COMPLEX.create(1, 0), COMPLEX.create(0, 0)] : [COMPLEX.create(0, 0), COMPLEX.create(1, 0)]);
                        }} className="px-4 py-2 bg-amber-500 text-slate-950 font-bold rounded-xl text-xs">Measure 1 Shot</button>
                        <span className="text-xs font-mono text-slate-400 self-center">|0⟩ hits: {shots.c0} | |1⟩ hits: {shots.c1}</span>
                      </>
                    )}
                    {activeLevel.id === 6 && (
                      <>
                        <button onClick={() => setTwoQubitProbs(simulateTwoQubit([{ type: 'H', target: 0 }, { type: 'H', target: 1 }]))} className="px-3 py-2 bg-purple-900 rounded-xl text-purple-300 text-xs font-bold">1. Superposition</button>
                        <button onClick={() => setTwoQubitProbs(simulateTwoQubit([{ type: 'H', target: 0 }, { type: 'H', target: 1 }, { type: 'ORACLE_11' }]))} className="px-3 py-2 bg-amber-900 rounded-xl text-amber-300 text-xs font-bold">2. Oracle (|11⟩)</button>
                        <button onClick={() => setTwoQubitProbs(simulateTwoQubit([{ type: 'H', target: 0 }, { type: 'H', target: 1 }, { type: 'ORACLE_11' }, { type: 'DIFFUSION' }]))} className="px-3 py-2 bg-pink-900 rounded-xl text-pink-300 text-xs font-bold">3. Diffusion (Amplify)</button>
                      </>
                    )}
                  </div>
                </div>
              )}

              {/* LESSON STEP 3: QUIZ */}
              {lessonStep === 'quiz' && (
                <div className="bg-slate-900 rounded-3xl p-6 sm:p-8 border border-slate-800 shadow-2xl space-y-5 animate-fadeIn">
                  <span className="text-xs font-bold text-purple-400 uppercase">Knowledge Check (+10 XP)</span>
                  <h3 className="text-xl font-bold text-white">{activeLevel.quiz.question}</h3>
                  <div className="space-y-2">
                    {activeLevel.quiz.options.map((opt, idx) => (
                      <button
                        key={idx}
                        onClick={() => handleQuiz(idx)}
                        disabled={feedback !== null}
                        className="w-full text-left p-4 rounded-2xl bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-purple-500 font-medium text-sm text-slate-200 transition-all"
                      >
                        <span className="w-6 h-6 rounded-lg bg-slate-800 inline-flex items-center justify-center font-bold text-xs text-purple-400 mr-3">
                          {String.fromCharCode(65 + idx)}
                        </span>
                        {opt}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* LESSON STEP 4: RESULTS */}
              {lessonStep === 'results' && (
                <div className="bg-slate-900 rounded-3xl p-8 border border-slate-800 text-center space-y-6 animate-fadeIn">
                  <div className="text-5xl">🎉</div>
                  <h2 className="text-2xl font-extrabold text-white">Level Complete!</h2>
                  <div className="text-3xl text-amber-400 font-bold">
                    {'★'.repeat(mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1)}
                  </div>
                  <div className="text-purple-400 font-bold text-lg">+35 XP Earned</div>
                  <button
                    onClick={() => setView('path')}
                    className="w-full py-4 rounded-2xl font-bold bg-gradient-to-r from-purple-600 to-cyan-500 text-white shadow-xl text-lg"
                  >
                    Back to Skill Tree
                  </button>
                </div>
              )}
            </main>
          )}

          {/* IMMEDIATE FEEDBACK BANNER */}
          {feedback && (
            <div className={`fixed bottom-0 left-0 right-0 p-5 border-t-2 z-50 animate-slideUp ${feedback.isCorrect ? 'bg-slate-950 border-emerald-500 text-emerald-300' : 'bg-slate-950 border-rose-500 text-rose-300'}`}>
              <div className="max-w-2xl mx-auto flex justify-between items-center gap-4">
                <div>
                  <h4 className="font-extrabold text-lg text-white">{feedback.isCorrect ? '✨ Correct!' : '❌ Not Quite'}</h4>
                  <p className="text-xs text-slate-300">{feedback.text}</p>
                </div>
                <button
                  onClick={handleContinueFromFeedback}
                  className={`px-6 py-3 rounded-xl font-bold text-white shadow-md text-sm ${feedback.isCorrect ? 'bg-emerald-500 hover:bg-emerald-400' : 'bg-rose-600 hover:bg-rose-500'}`}
                >
                  Continue
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
