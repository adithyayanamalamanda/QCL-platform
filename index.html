<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%238b5cf6'/><text x='50' y='60' font-size='30' text-anchor='middle' fill='white'>Q</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuantumQuest — Duolingo for Quantum Computing</title>
    <meta name="description" content="A Duolingo-style gamified platform for learning quantum computing algorithms through simulations and hands-on exercises." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            animation: {
              'spin-slow': 'spin 12s linear infinite',
              'bounce-subtle': 'bounceSubtle 3s ease-in-out infinite',
              'pulse-glow': 'pulseGlow 2.5s infinite',
              'slideUp': 'slideUp 0.35s ease-out',
              'fadeIn': 'fadeIn 0.35s ease-out'
            },
            keyframes: {
              bounceSubtle: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-6px)' }
              },
              pulseGlow: {
                '0%, 100%': { boxShadow: '0 0 15px rgba(139, 92, 246, 0.4)' },
                '50%': { boxShadow: '0 0 30px rgba(6, 182, 212, 0.7)' }
              },
              slideUp: {
                '0%': { transform: 'translateY(100%)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' }
              },
              fadeIn: {
                '0%': { opacity: '0', transform: 'scale(0.98)' },
                '100%': { opacity: '1', transform: 'scale(1)' }
              }
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-purple-600 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
